<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Natalia Sharova | Fine Artist</title>
  <meta name="description" content="Original paintings and fine art prints by Natalia Sharova.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="wrap header-inner">
      <nav class="nav">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <a class="logo" href="index.html">Natalia Sharova</a>
      <div class="header-right">
        <a href="https://www.instagram.com/artbysharova" aria-label="Instagram" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
        </a>
        <a href="#contact" aria-label="Email">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main>
    <!-- WELCOME -->
    <section class="welcome wrap">
      <h1>[Insert quote here]</h1>
      <div class="eyebrow">quote attribution</div>
    </section>

    <div class="divider"></div>

    <!-- SHOP -->
    <section class="shop wrap" id="shop">
      <h2 class="section-title">Available Work</h2>
      <div class="filters">
        <button class="active" data-filter="original">Originals</button>
        <button data-filter="print">Prints</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <!-- FOOTER / CONTACT -->
  <footer class="site-footer" id="contact">
    <div class="wrap">
      <h2>Contact</h2>
      <p class="lead">For commissions, gallery inquiries, or questions about a painting,<br>I'd love to hear from you.</p>
      <div class="contact-links">
        <a href="mailto:hello@nataliasharova.com">hello@nataliasharova.com</a>
        <a class="ig" href="https://www.instagram.com/artbysharova" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
        </a>
      </div>
      <form class="signup" onsubmit="event.preventDefault(); this.innerHTML='<p style=&quot;padding:12px 16px&quot;>Thank you. You&rsquo;re on the list.</p>';">
        <input type="email" placeholder="Join the mailing list for new releases" required aria-label="Email address">
        <button type="submit">Sign up</button>
      </form>
      <p class="fine-print">© 2026 Natalia Sharova. All rights reserved.</p>
    </div>
  </footer>

  <!-- DETAIL VIEW (filled in automatically when a painting is clicked) -->
  <div class="detail" id="detail" role="dialog" aria-modal="true">
    <button class="detail-close">Close</button>
    <div class="detail-inner"></div>
  </div>

  <script>
    window.addEventListener("scroll", () =>
      document.querySelector(".site-header").classList.toggle("scrolled", scrollY > 10));
  </script>
  <script src="artworks.js"></script>
  <script src="shop.js"></script>
</body>
</html>
